<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="800" height="340" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a0a0a">F = (P, E, R, C) — Dark Matter Field Engine</text>
  <text x="400" y="50" text-anchor="middle" font-size="10" fill="#888880">UUON Foundation Inc. — Phillip Aguilar Ruiz III</text>

  <!-- P box -->
  <rect x="40" y="80" width="160" height="160" rx="4" fill="#0a0a0a"/>
  <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5f5f0">P</text>
  <text x="120" y="124" text-anchor="middle" font-size="10" fill="#888880">PARAMETERS</text>
  <text x="60" y="148" font-size="10" fill="#a8d8a8">shape</text>
  <text x="60" y="163" font-size="10" fill="#a8d8a8">algorithm</text>
  <text x="60" y="178" font-size="10" fill="#a8d8a8">amplitude</text>
  <text x="60" y="193" font-size="10" fill="#a8d8a8">frequency</text>
  <text x="60" y="208" font-size="10" fill="#a8d8a8">speed</text>
  <text x="60" y="223" font-size="10" fill="#a8d8a8">octaves</text>

  <!-- Arrow P→E -->
  <line x1="200" y1="160" x2="248" y2="160" stroke="#0a0a0a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E box -->
  <rect x="250" y="80" width="160" height="160" rx="4" fill="#0a0a0a"/>
  <text x="330" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5f5f0">E</text>
  <text x="330" y="124" text-anchor="middle" font-size="10" fill="#888880">ENCODING</text>
  <text x="265" y="150" font-size="10" fill="#f0c070">compute(</text>
  <text x="265" y="165" font-size="10" fill="#f0c070">  x, y, z,</text>
  <text x="265" y="180" font-size="10" fill="#f0c070">  t, params,</text>
  <text x="265" y="195" font-size="10" fill="#f0c070">  s</text>
  <text x="265" y="210" font-size="10" fill="#f0c070">) → d</text>
  <text x="265" y="228" font-size="9" fill="#666">24 wave functions</text>

  <!-- Arrow E→R -->
  <line x1="410" y1="160" x2="458" y2="160" stroke="#0a0a0a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R box -->
  <rect x="460" y="80" width="160" height="160" rx="4" fill="#0a0a0a"/>
  <text x="540" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5f5f0">R</text>
  <text x="540" y="124" text-anchor="middle" font-size="10" fill="#888880">REPRESENTATION</text>
  <text x="476" y="148" font-size="10" fill="#a8d8a8">WebGL mesh</text>
  <text x="476" y="163" font-size="10" fill="#a8d8a8">Animated GLB</text>
  <text x="476" y="178" font-size="10" fill="#a8d8a8">morph targets</text>
  <text x="476" y="193" font-size="10" fill="#a8d8a8">Static OBJ</text>
  <text x="476" y="208" font-size="10" fill="#a8d8a8">JSON metadata</text>

  <!-- C — bottom bar -->
  <rect x="40" y="270" width="580" height="48" rx="4" fill="#0a0a0a"/>
  <text x="330" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5f5f0">C — COMPRESSION RATIO</text>
  <text x="330" y="308" text-anchor="middle" font-size="10" fill="#888880">P = 48 bytes (6 floats)  ·  R ≈ 180KB–1.4MB  ·  C ≈ 3750:1 – 29000:1</text>

  <!-- Vertical connectors from R and P down to C -->
  <line x1="120" y1="240" x2="120" y2="270" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="540" y1="240" x2="540" y2="270" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0a0a0a"/>
    </marker>
  </defs>
</svg>
